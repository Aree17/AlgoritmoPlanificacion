{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar Procesos</title>
  <link rel="stylesheet" href="{% static 'css/ingresar.css' %}">
</head>
<body>

  <div class="form-container fade-in">
    <h2>Ingreso de procesos</h2>
    <p>Registra los procesos para simular el algoritmo SJF no apropiativo.</p>

    <div id="msgError" class="msg msg-error" style="display:none;"></div>

    <div class="control-panel">
      <div>
        <label for="numProcesos">Número de procesos</label>
        <input type="number" id="numProcesos" min="1" placeholder="Ej: 3">
      </div>
      <button type="button" onclick="generarProcesos()">Generar</button>
    </div>

    <form method="post">
      {% csrf_token %}

      <input type="hidden" name="num_procesos" id="num_procesos">
      <input type="hidden" id="baseNombre" value="{{ siguiente_proceso|default:1 }}">

      <div id="contenedorProcesos"></div>

      <div class="form-actions">
        <button type="submit">Guardar procesos</button>
      </div>
    </form>

    <a class="back-link" href="/lista/">Ver procesos</a>
  </div>

  <script src="{% static 'js/ingresar.js' %}"></script>
</body>
</html>
